  <rect x="45" y="300" width="255" height="110" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="172.5" y="345" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">REST API Gateway</text>
  <text x="172.5" y="372" font-size="14" fill="#94A3B8" text-anchor="middle">Roteamento e cache</text>
  <text x="172.5" y="394" font-size="14" fill="#94A3B8" text-anchor="middle">Fastify, CORS</text>

  <rect x="330" y="300" width="255" height="110" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="457.5" y="345" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Rate Limit</text>
  <text x="457.5" y="372" font-size="14" fill="#94A3B8" text-anchor="middle">60 requisições/min por IP</text>
  <text x="457.5" y="394" font-size="14" fill="#94A3B8" text-anchor="middle">sem auth no MVP</text>

  <rect x="615" y="300" width="255" height="110" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="742.5" y="345" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Cache (Redis)</text>
  <text x="742.5" y="372" font-size="14" fill="#94A3B8" text-anchor="middle">Preços: 5 min</text>
  <text x="742.5" y="394" font-size="14" fill="#94A3B8" text-anchor="middle">Recomendação IA: 1 h</text>

  <rect x="900" y="300" width="255" height="110" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
  <text x="1027.5" y="345" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Job Scheduler</text>
  <text x="1027.5" y="372" font-size="14" fill="#94A3B8" text-anchor="middle">Cron / BullMQ</text>
  <text x="1027.5" y="394" font-size="14" fill="#94A3B8" text-anchor="middle">Coleta diária às 19h30</text>

  <!-- FONTES EXTERNAS (y=475) -->
  <rect x="45" y="475" width="255" height="110" rx="12" fill="#1E293B" stroke="#FB923C" stroke-width="2"/>
  <text x="172.5" y="520" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">brapi + Yahoo</text>
  <text x="172.5" y="547" font-size="14" fill="#94A3B8" text-anchor="middle">Preços em tempo real</text>
  <text x="172.5" y="569" font-size="14" fill="#94A3B8" text-anchor="middle">Histórico OHLCV</text>

  <rect x="330" y="475" width="255" height="110" rx="12" fill="#1E293B" stroke="#FB923C" stroke-width="2"/>
  <text x="457.5" y="520" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">B3 / Investidor10</text>
  <text x="457.5" y="547" font-size="14" fill="#94A3B8" text-anchor="middle">Fatos relevantes</text>
  <text x="457.5" y="569" font-size="14" fill="#94A3B8" text-anchor="middle">Scraping controlado</text>

  <rect x="615" y="475" width="255" height="110" rx="12" fill="#1E293B" stroke="#FB923C" stroke-width="2"/>
  <text x="742.5" y="520" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Alpha Vantage</text>
  <text x="742.5" y="547" font-size="14" fill="#94A3B8" text-anchor="middle">Fundamentos / DRE</text>
  <text x="742.5" y="569" font-size="14" fill="#94A3B8" text-anchor="middle">P/L, DY, ROE</text>

  <rect x="900" y="475" width="255" height="110" rx="12" fill="#1E293B" stroke="#FB923C" stroke-width="2"/>
  <text x="1027.5" y="520" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Claude API</text>
  <text x="1027.5" y="547" font-size="14" fill="#94A3B8" text-anchor="middle">Análise e recomendação</text>
  <text x="1027.5" y="569" font-size="14" fill="#94A3B8" text-anchor="middle">modelo claude-sonnet-4-6</text>

  <!-- PERSISTÊNCIA (y=650) -->
  <rect x="45" y="650" width="255" height="110" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="172.5" y="695" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">PostgreSQL</text>
  <text x="172.5" y="722" font-size="14" fill="#94A3B8" text-anchor="middle">Ativos e histórico</text>
  <text x="172.5" y="744" font-size="14" fill="#94A3B8" text-anchor="middle">Prisma (ORM)</text>

  <rect x="330" y="650" width="255" height="110" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="457.5" y="695" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">TimescaleDB</text>
  <text x="457.5" y="722" font-size="14" fill="#94A3B8" text-anchor="middle">Séries temporais OHLCV</text>
  <text x="457.5" y="744" font-size="14" fill="#94A3B8" text-anchor="middle">extensão do PostgreSQL</text>

  <rect x="615" y="650" width="255" height="110" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="742.5" y="695" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Redis</text>
  <text x="742.5" y="722" font-size="14" fill="#94A3B8" text-anchor="middle">Cache em memória</text>
  <text x="742.5" y="744" font-size="14" fill="#94A3B8" text-anchor="middle">ioredis</text>

  <rect x="900" y="650" width="255" height="110" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <text x="1027.5" y="695" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">S3</text>
  <text x="1027.5" y="722" font-size="14" fill="#94A3B8" text-anchor="middle">Relatórios PDF</text>
  <text x="1027.5" y="744" font-size="14" fill="#94A3B8" text-anchor="middle">armazenamento de arquivos</text>

  <!-- Legenda -->
  <text x="45" y="820" font-size="12" fill="#64748B">Azul: frontend · Roxo: backend · Laranja: APIs externas · Verde: persistência</text>
  <text x="45" y="840" font-size="12" fill="#64748B">Fonte: PRD.md e TASKS.md do projeto IBovespa Dashboard</text>
</svg>
