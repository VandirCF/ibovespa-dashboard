<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Fundo e título -->
  <rect width="1200" height="870" fill="#0F172A"/>
  <text x="45" y="50" font-size="28" font-weight="bold" fill="#F8FAFC">IBovespa Dashboard: arquitetura da aplicação</text>
  <text x="45" y="78" font-size="15" fill="#94A3B8">Frontend (Next.js) → Backend (Fastify) → Fontes externas e persistência</text>

  <!-- Rótulos de camada -->
  <text x="45" y="112" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748B">FRONTEND (Next.js + TypeScript)</text>
  <text x="45" y="287" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748B">BACKEND (Node.js / Fastify)</text>
  <text x="45" y="462" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748B">FONTES DE DADOS EXTERNAS</text>
  <text x="45" y="637" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#64748B">PERSISTÊNCIA</text>

  <!-- Setas entre camadas -->
  <line x1="457.5" y1="236" x2="457.5" y2="298" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="742.5" y1="236" x2="742.5" y2="298" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="1027.5" y1="236" x2="1027.5" y2="298" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>

  <line x1="457.5" y1="411" x2="457.5" y2="473" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="742.5" y1="411" x2="742.5" y2="473" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="1027.5" y1="411" x2="1027.5" y2="473" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>

  <line x1="457.5" y1="586" x2="457.5" y2="648" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="742.5" y1="586" x2="742.5" y2="648" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="1027.5" y1="586" x2="1027.5" y2="648" stroke="#94A3B8" stroke-width="2" marker-end="url(#seta)"/>

  <!-- FRONTEND (y=125) -->
  <rect x="45" y="125" width="255" height="110" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="172.5" y="170" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Busca</text>
  <text x="172.5" y="197" font-size="14" fill="#94A3B8" text-anchor="middle">Filtro por ativo</text>
  <text x="172.5" y="219" font-size="14" fill="#94A3B8" text-anchor="middle">e setor</text>

  <rect x="330" y="125" width="255" height="110" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="457.5" y="170" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Gráficos</text>
  <text x="457.5" y="197" font-size="14" fill="#94A3B8" text-anchor="middle">Candlestick, linha</text>
  <text x="457.5" y="219" font-size="14" fill="#94A3B8" text-anchor="middle">e volume (1D a 5A)</text>

  <rect x="615" y="125" width="255" height="110" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="742.5" y="170" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Fatos relevantes</text>
  <text x="742.5" y="197" font-size="14" fill="#94A3B8" text-anchor="middle">Comunicados da B3</text>
  <text x="742.5" y="219" font-size="14" fill="#94A3B8" text-anchor="middle">filtro 30 / 90 / 180 dias</text>

  <rect x="900" y="125" width="255" height="110" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="1027.5" y="170" font-size="19" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Recomendações</text>
  <text x="1027.5" y="197" font-size="14" fill="#94A3B8" text-anchor="middle">IA (Claude API)</text>
  <text x="1027.5" y="219" font-size="14" fill="#94A3B8" text-anchor="middle">Comprar · Manter · Vender</text>

